task: detection-adn

model: RTDETR
criterion: SetCriterion
criterion_kd: SetCriterionKD
postprocessor: RTDETRPostProcessor


RTDETR: 
  backbone: ResNet_ADN   # PResNet
  encoder: HybridEncoder
  decoder: RTDETRTransformer
  multi_scale: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800]

PResNet:
  depth: 50
  variant: d
  freeze_at: 0
  return_idx: [1, 2, 3]
  num_stages: 4
  freeze_norm: True
  pretrained: True 

ResNet_ADN:
  depth: 50
  variant: d  # exp 2025.05.10
  freeze_at: 0
  return_idx: [1, 2, 3]
  num_stages: 4
  freeze_norm: True
  pretrained: True 

HybridEncoder:
  in_channels: [512, 1024, 2048]
  feat_strides: [8, 16, 32]

  # intra
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  pe_temperature: 10000
  
  # cross
  expansion: 1.0
  depth_mult: 1
  act: 'silu'

  # eval
  eval_spatial_size: [640, 640]


RTDETRTransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3

  num_queries: 300

  num_decoder_layers: 6
  num_denoising: 100
  
  eval_idx: -1
  eval_spatial_size: [640, 640]


use_focal_loss: True

RTDETRPostProcessor:
  num_top_queries: 300


SetCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2,}
  losses: ['vfl', 'boxes', ]
  alpha: 0.75
  gamma: 2.0

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    # use_focal_loss: True 
    alpha: 0.25
    gamma: 2.0

SetCriterionKD2:
  weight_dict_kd: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_features_backbone_kd: 1, loss_features_encoder_kd: 1}
  losses: ['vfl', 'boxes', 'features_kd',]
  # losses: ['vfl', 'boxes',]
  weight_dict_aux: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2,}
  losses_aux: ['vfl', 'boxes', ] 
  alpha: 0.75
  gamma: 2.0

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    # use_focal_loss: True 
    alpha: 0.25
    gamma: 2.0

SetCriterionKD:
  # original
  weight_dict_kd: {loss_vfl_kd: 1, loss_bbox_kd: 5, loss_giou_kd: 2, loss_features_backbone_kd: 1, loss_features_encoder_kd: 1}
  
  # more weight to loss_vfl_kd
  # weight_dict_kd: {loss_vfl_kd: 2, loss_bbox_kd: 5, loss_giou_kd: 2, loss_features_backbone_kd: 1, loss_features_encoder_kd: 1}
  
  # no weight to loss_features_encoder_kd and loss_features_backbone_kd
  # weight_dict_kd: {loss_vfl_kd: 1, loss_bbox_kd: 5, loss_giou_kd: 2, loss_features_backbone_kd: 0, loss_features_encoder_kd: 0}
  # exp:
  # weight_dict_kd: {loss_vfl_kd: 0.1, loss_bbox_kd: 0.5, loss_giou_kd: 0.2, loss_features_backbone_kd: 0, loss_features_encoder_kd: 0}
  losses_kd: ['vfl_kd', 'boxes_kd', 'features_kd',] #orig
  # losses_kd: ['vfl_kd', 'boxes_kd']  # exp:2025.05.21
  losses_kd_aux: ['vfl_kd', 'boxes_kd', ]
  # losses_aux: ['vfl', 'boxes', ]
  
  # original 
  weight_dict_dn: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2,}
  # weight_dict_dn: {loss_vfl: 0.1, loss_bbox: 0.5, loss_giou: 0.2,}
  losses_dn: ['vfl', 'boxes', ]

  alpha: 0.75
  gamma: 2.0

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    # use_focal_loss: True 
    alpha: 0.25
    gamma: 2.0


